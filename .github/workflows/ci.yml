name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: MoscowDev/liquivault-sdk
          path: sdk-source
      - name: Prepare sibling SDK
        run: |
          mv sdk-source ../liquivault-sdk
          npm ci --prefix ../liquivault-sdk
      - name: Check documentation
        run: node scripts/check-docs.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser wallet checks
        run: npm run test:browser
      - name: Build
        run: npm run build
