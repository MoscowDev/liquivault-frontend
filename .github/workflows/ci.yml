name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: MoscowDev/liquivault-sdk
          path: sdk-source
      - name: Prepare sibling SDK
        run: |
          mv sdk-source ../liquivault-sdk
          npm ci --prefix ../liquivault-sdk
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
